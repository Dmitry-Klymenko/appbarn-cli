name: publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Validate tag and ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-rc\.[1-9]\d*)?$/.test(tag) || tag !== 'v' + pkg.version) {
            throw new Error('Tag/version mismatch: ' + tag);
          }
          const version = readFileSync('src/version.ts', 'utf8');
          if (!version.includes("CLI_VERSION = '" + pkg.version + "'")) throw new Error('Runtime/package version mismatch');
          NODE
      - run: npm install --global npm@11.6.2
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Publish via npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL=latest
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then CHANNEL=next; fi
          npm publish --access public --provenance --tag "$CHANNEL"
      - name: Verify exact registry version, channel and provenance
        run: node tools/verify-published.mjs "$GITHUB_REF_NAME"
